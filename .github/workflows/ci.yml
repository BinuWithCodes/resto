name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]

# One run per ref; cancel superseded runs to save GitHub Actions minutes (§3 budget).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

    # NOTE: the local-Supabase + migrations + pgTAP stage is added in step 0.6,
    # once there is a schema and tests to run. Nothing to run before then.
