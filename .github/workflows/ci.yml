name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]

# One run per ref; cancel superseded runs to save GitHub Actions minutes (§3 budget).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  db:
    name: migrations · pgTAP (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts local Postgres and applies db/migrations (via the
      # supabase/migrations symlink). auth schema is present for auth.users FKs.
      - name: Start local database
        run: supabase db start

      - name: pgTAP tests
        run: supabase test db
